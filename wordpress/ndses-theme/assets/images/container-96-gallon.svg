<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">96 gallon wheeled cart</title>
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#14522f"/>
      <stop offset="0.55" stop-color="#1d6b3e"/>
      <stop offset="1" stop-color="#0f3d25"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a7a4b"/>
      <stop offset="1" stop-color="#145230"/>
    </linearGradient>
    <linearGradient id="side" x1="0" x2="1">
      <stop offset="0" stop-color="#0b2e1c"/>
      <stop offset="1" stop-color="#14522f"/>
    </linearGradient>
  </defs>

  <!-- Header lettering sized to match the other container graphics. -->
  <text x="200" y="44" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="40" fill="#111">96 GALLON</text>
  <text x="200" y="86" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="40" fill="#111">CART</text>

  <ellipse cx="204" cy="288" rx="92" ry="7" fill="#000" opacity="0.12"/>

  <!-- handle -->
  <rect x="138" y="104" width="136" height="10" rx="5" fill="#0b2e1c"/>

  <!-- side panel (depth) -->
  <path d="M262 124 L286 118 L276 274 L254 282 Z" fill="url(#side)"/>

  <!-- body -->
  <path d="M128 124 L262 124 L254 282 L138 282 Z" fill="url(#body)"/>
  <path d="M142 150 L250 150" stroke="#0f3d25" stroke-width="3" opacity="0.5"/>
  <path d="M146 258 L246 258" stroke="#0f3d25" stroke-width="3" opacity="0.5"/>

  <!-- lid -->
  <path d="M120 112 L272 112 L292 106 L292 118 L272 128 L120 128 Z" fill="url(#lid)"/>

  <!-- NDS mark -->
  <g transform="translate(196 208)">
    <path d="M-46 12 C-22 28 32 28 50 2" fill="none" stroke="#d9a520" stroke-width="4.5" stroke-linecap="round"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-style="italic" font-weight="900" font-size="32" fill="#ffffff">NDS</text>
  </g>

  <!-- wheels and axle -->
  <rect x="136" y="272" width="128" height="7" rx="3.5" fill="#0b2e1c"/>
  <circle cx="150" cy="280" r="13" fill="#1a1a1a"/>
  <circle cx="150" cy="280" r="5" fill="#6b6b6b"/>
  <circle cx="258" cy="280" r="13" fill="#1a1a1a"/>
  <circle cx="258" cy="280" r="5" fill="#6b6b6b"/>
</svg>
